name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  NODE_VERSION: '26'
  PNPM_VERSION: 12.16.1 # keep in sync with devEngines.packageManager in package.json
  NPM_VERSION: 12.2.3 # npm with trusted publishing support
  TARBALL: oxlint-config.tgz

jobs:
  # Gate: only publish a stable version from a tag on main whose commit passed CI.
  verify:
    name: Verify release
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches a stable package.json version
        run: |
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Only stable versions can be published (got $version)."; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || {
            echo "::error::Run this from the tag v$version (got $GITHUB_REF)."; exit 1; }

      - name: Check the commit is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo '::error::The release commit is not on main.'; exit 1; }

      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$GITHUB_SHA" --event push --status success --limit 100 \
            --json databaseId --jq 'length')
          [[ "$count" -gt 0 ]] || {
            echo '::error::This commit needs a successful CI run on main.'; exit 1; }

  # Build and test the exact tarball, without access to publishing credentials.
  build:
    name: Build package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Format, lint and type checks
        run: pnpm check

      - run: pnpm test

      - name: Build and pack with resolved catalog dependencies
        run: pnpm pack --out "$RUNNER_TEMP/$TARBALL"

      - name: Test the exact package to publish
        run: pnpm test:package "$RUNNER_TEMP/$TARBALL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 1

  # Publish the tested tarball. This is the only job with an OIDC token.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        working-directory: ${{ runner.temp }}
        run: npm install --global "npm@$NPM_VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}
        run: npm publish "$RUNNER_TEMP/$TARBALL" --access public --provenance --ignore-scripts
